<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Jhave's Poetry Slam</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <canvas id="stage" aria-hidden="true"></canvas>

  <div id="tray" class="tray" aria-label="Lines you can perform"></div>

  <div class="hud">
    <div class="clock"><span id="clock">0:55</span><small>left in the set</small></div>
    <div class="tally"><span>&#128079; <b id="claps">0</b></span><span>&#128013; <b id="hisses">0</b></span></div>
  </div>

  <div id="title-card" class="title-card">
    <div class="burst"></div>
    <div class="title-inner">
      <p class="kicker">Live at the Caf&eacute; Glia &bull; Open Mic Night</p>
      <h1>Jhave&rsquo;s<br>Poetry Slam!</h1>
      <p class="tagline">Click the lines. Perform the poem. Survive the hipsters.</p>
      <p id="start-hint" class="start-hint">Press <b>Start Room</b> to take the stage</p>
    </div>
  </div>

  <div id="finale" class="finale" hidden>
    <div class="finale-card">
      <h2>SLAM CHAMPION!</h2>
      <p id="finale-sub" class="finale-sub"></p>
      <ol id="poem" class="poem"></ol>
    </div>
  </div>

  <p id="say" class="sr-only" aria-live="polite"></p>
  <p class="credit">Words: David Jhave Johnston, <a href="https://glia.ca/" target="_blank" rel="noopener">glia.ca</a> (CC BY-NC-SA 4.0) &middot; Photo: Universitetet i Bergen</p>

  <script src="./game.js"></script>
</body>
</html>
